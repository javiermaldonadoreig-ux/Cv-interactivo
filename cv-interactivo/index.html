<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Javier Maldonado Reig — CV</title>
  <meta name="description" content="Interactive CV of Javier Maldonado Reig. Business Administration student at ICAI-ICADE, seeking a Summer 2027 internship in strategy consulting." />
  <meta property="og:title" content="Javier Maldonado Reig — CV" />
  <meta property="og:description" content="An interactive, Twine-style CV. Choose your own path." />
  <meta property="og:image" content="/assets/foto.jpg" />
  <meta name="theme-color" content="#171915" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171915'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-size='30' fill='%23e3bd7a'%3EJM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fondo: manchas de color difuminadas + grano -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>
  <svg class="grain" aria-hidden="true">
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" /></filter>
    <rect width="100%" height="100%" filter="url(#noise)" />
  </svg>

  <header class="topbar glass">
    <a class="brand" href="#/start" aria-label="Back to start">
      <span class="brand-avatar"><img src="assets/foto.jpg" alt="" onerror="this.remove()" /><span>JM</span></span>
      <span class="brand-text">J. Maldonado Reig<em>cv.twee</em></span>
    </a>
    <nav class="tools">
      <span class="counter" id="counter" title="Passages discovered">0 / 0</span>
      <button class="tool" id="btn-map" type="button" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="6" height="4" rx="1"/><rect x="12" y="3" width="6" height="4" rx="1"/><rect x="7" y="13" width="6" height="4" rx="1"/><path d="M5 7v2.5c0 1 .8 1.5 1.5 1.5H10m5-4v2.5c0 1-.8 1.5-1.5 1.5H10v2"/></svg>
        <span data-i18n="map">Map</span>
      </button>
      <button class="tool lang" id="btn-lang" type="button" aria-label="Change language">ES</button>
    </nav>
  </header>

  <main class="stage">
    <nav class="trail" id="trail" aria-label="Your path"></nav>
    <article class="passage glass" id="passage" aria-live="polite"></article>
    <div class="under">
      <button class="ghost" id="btn-back" type="button">← <span data-i18n="back">Back</span></button>
      <span class="hint" data-i18n="hint">1–9 to choose · M for the map</span>
    </div>
  </main>

  <dialog class="map glass" id="map">
    <div class="map-head">
      <div>
        <p class="tag">::story-map</p>
        <h2 data-i18n="mapTitle">Story map</h2>
      </div>
      <button class="ghost" id="btn-map-close" type="button" data-i18n="close">Close</button>
    </div>
    <div class="map-body"><svg id="map-svg" role="img" aria-label="Story map"></svg></div>
    <p class="map-legend">
      <span><i class="dot visited"></i><span data-i18n="visited">visited</span></span>
      <span><i class="dot here"></i><span data-i18n="here">you are here</span></span>
      <span><i class="dot"></i><span data-i18n="unvisited">not yet</span></span>
    </p>
  </dialog>

  <script src="story.js"></script>
  <script src="app.js"></script>
</body>
</html>
